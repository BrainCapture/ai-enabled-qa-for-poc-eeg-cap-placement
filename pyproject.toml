[project]
name = "ai-enabled-qa-for-poc-eeg-cap-placement"
version = "1.0.0"
description = "Reproduction code and data for the clinical validation of an AI-enabled EEG cap placement quality-assurance system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT (code) and CC-BY-4.0 (data) — see LICENSE" }

# Everything the clinical analysis and the forward model need. The bounds are
# deliberately loose: every published number reproduces on current versions
# too (checked against pandas 3.0 / matplotlib 3.11). Only the rendered pixels
# move, which is what uv.lock is for — see [tool.uv] below.
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "mne>=1.7",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
# Fixed resolution cut-off, so `uv sync` rebuilds the exact environment the
# committed figures in study/outputs/ and forward_model/figures/ were
# rendered in — matplotlib 3.10.7, pandas 2.3.3, numpy 2.3.4, mne 1.10.2.
# That is what makes `git diff` after a run a meaningful
# reproduction check rather than a font-version diff. Delete this line to
# resolve against current releases; the numbers are unaffected.
exclude-newer = "2025-11-15T00:00:00Z"

[tool.ruff]
line-length = 100
