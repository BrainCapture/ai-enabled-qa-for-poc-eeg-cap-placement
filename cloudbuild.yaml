steps:
# Access the secret and write it to a file in the workspace
- name: 'gcr.io/cloud-builders/gcloud'
  id: PrepareSecretFile
  entrypoint: 'bash'
  args:
    - '-c'
    # Use the $$ syntax to access the secret value from the env var defined in availableSecrets
    # Write the content of the $$GCP_KEY_SECRET env var to a file named key.json in the workspace
    - 'echo "$$GCP_KEY_SECRET" > /workspace/key.json'
  secretEnv: ['GCP_KEY_SECRET'] # Make the env var available to this step

# Build the container image using BuildKit and the secret file
- name: 'gcr.io/cloud-builders/docker'
  id: Build
  # This step depends on the file created in the previous step
  waitFor: ['PrepareSecretFile']
  args:
    - 'build'
    # Define the secret for the build step.
    # 'id=svc' matches the Dockerfile RUN --mount.
    # 'src=/workspace/key.json' points to the file created in the previous step.
    - '--secret'
    - 'id=svc,src=/workspace/key.json'
    - '-t'
    - '$_AR_HOSTNAME/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
    - '.' # Build context
  # Enable BuildKit for this step
  env:
    - 'DOCKER_BUILDKIT=1'

# Push the image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  args: ['push', '$_AR_HOSTNAME/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA']

# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: Deploy
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - '$_SERVICE_NAME' # Target service (e.g., dev-api or prod-api via trigger)
    - '--image'
    - '$_AR_HOSTNAME/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'
    - '--region'
    - '$_REGION'
    - '--quiet' # Suppress interactive prompts

# Define the secret to be made available via environment variable
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/ad-sa-key/versions/latest
    # Cloud Build will make the secret's value available in this env var
    # for steps that declare it in 'secretEnv'
    env: 'GCP_KEY_SECRET'

# Define images to be pushed
images:
  - '$_AR_HOSTNAME/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA'

# Default substitutions (can be overridden by trigger settings)
substitutions:
  _AR_HOSTNAME: 'europe-west6-docker.pkg.dev'
  _REPOSITORY: 'abnormality-detector'
  _REGION: 'europe-west1'
  _SERVICE_NAME: 'default-service-name' # Default, MUST be overridden in trigger

options:
  logging: CLOUD_LOGGING_ONLY # Use standard Cloud Logging